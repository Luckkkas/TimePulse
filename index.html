<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" 
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="stopwatch">
        <h2 class="timer">00:00:00:00</h2>

    <div class="actions">
        <button class="reset">
            <i class="fa-solid fa-rotate"></i>
        </button>
        <button class="power" action="start">
            <i class="fa-solid fa-play"></i>
        </button>
        <button class="mark">
            <i class="fa-solid fa-flag"></i>
        </button>
    </div>

    <div class="marks-list"></div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
